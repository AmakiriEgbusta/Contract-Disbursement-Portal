<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRemote - Location Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .status {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .status-item:last-child {
            border-bottom: none;
        }

        .status-label {
            font-weight: 600;
            color: #4a5568;
        }

        .status-value {
            color: #2d3748;
        }

        .locations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .location-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.3s ease;
        }

        .location-card:hover {
            transform: translateY(-5px);
        }

        .location-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .location-id {
            background: #667eea;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .location-time {
            color: #718096;
            font-size: 0.9rem;
        }

        .location-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .detail-item {
            padding: 8px;
            background: #f7fafc;
            border-radius: 8px;
        }

        .detail-label {
            font-size: 0.8rem;
            color: #718096;
            margin-bottom: 3px;
        }

        .detail-value {
            font-size: 1rem;
            font-weight: 600;
            color: #2d3748;
        }

        .no-locations {
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 50px 20px;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            color: white;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .locations-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌍 LRemote Location Tracker</h1>
            <p>Automatic location monitoring active</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="status" id="statusSection">
            <h3 style="margin-bottom: 15px; color: #2d3748;">📊 Tracking Status</h3>
            <div class="status-item">
                <span class="status-label">Status:</span>
                <span class="status-value" id="trackingStatus">Active</span>
            </div>
            <div class="status-item">
                <span class="status-label">Total Locations:</span>
                <span class="status-value" id="totalLocations">0</span>
            </div>
            <div class="status-item">
                <span class="status-label">Last Update:</span>
                <span class="status-value" id="lastUpdate">Never</span>
            </div>
            <div class="status-item">
                <span class="status-label">Next Update:</span>
                <span class="status-value" id="nextUpdate">--</span>
            </div>
            <div class="status-item">
                <span class="status-label">Accuracy:</span>
                <span class="status-value" id="currentAccuracy">N/A</span>
            </div>
        </div>

        <div id="locationsContainer">
            <div class="no-locations" id="noLocations">
                <p>Initializing location tracking...</p>
            </div>
            <div class="locations-grid" id="locationsGrid" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Global variables
        let locations = [];
        let trackingInterval = null;
        let nextUpdateTime = null;
        let countdownInterval = null;

        // Display error message silently (log to console only)
        function showError(message) {
            console.warn('Location Error:', message);
            // Don't show errors to user - keep it silent
        }

        // Update status display
        function updateStatus() {
            document.getElementById('statusSection').style.display = 'block';
            document.getElementById('trackingStatus').textContent = 'Active';
            document.getElementById('totalLocations').textContent = locations.length;
            document.getElementById('lastUpdate').textContent = locations.length > 0 ? 
                new Date(locations[locations.length - 1].timestamp).toLocaleString() : 'Never';
            
            if (locations.length > 0) {
                const lastLocation = locations[locations.length - 1];
                document.getElementById('currentAccuracy').textContent = 
                    lastLocation.accuracy ? `${lastLocation.accuracy.toFixed(2)} meters` : 'N/A';
            }
        }

        // Update countdown timer
        function updateCountdown() {
            if (nextUpdateTime) {
                const now = new Date().getTime();
                const remaining = nextUpdateTime - now;
                
                if (remaining > 0) {
                    const seconds = Math.floor(remaining / 1000);
                    document.getElementById('nextUpdate').textContent = `${seconds}s`;
                } else {
                    document.getElementById('nextUpdate').textContent = 'Updating...';
                }
            }
        }

        // Get full location details
        function getLocationDetails(position) {
            return {
                id: locations.length + 1,
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy,
                altitude: position.coords.altitude,
                altitudeAccuracy: position.coords.altitudeAccuracy,
                heading: position.coords.heading,
                speed: position.coords.speed,
                timestamp: position.timestamp,
                obtainedAt: new Date().toISOString()
            };
        }

        // Display locations
        function displayLocations() {
            const grid = document.getElementById('locationsGrid');
            const noLocations = document.getElementById('noLocations');
            
            if (locations.length === 0) {
                noLocations.style.display = 'block';
                grid.style.display = 'none';
                return;
            }

            noLocations.style.display = 'none';
            grid.style.display = 'grid';
            grid.innerHTML = '';

            locations.slice().reverse().forEach(location => {
                const card = createLocationCard(location);
                grid.appendChild(card);
            });

            updateStatus();
        }

        // Create location card
        function createLocationCard(location) {
            const card = document.createElement('div');
            card.className = 'location-card';
            
            const date = new Date(location.timestamp);
            const formattedDate = date.toLocaleDateString();
            const formattedTime = date.toLocaleTimeString();

            card.innerHTML = `
                <div class="location-header">
                    <span class="location-id">#${location.id}</span>
                    <span class="location-time">${formattedDate} ${formattedTime}</span>
                </div>
                <div class="location-details">
                    <div class="detail-item">
                        <div class="detail-label">Latitude</div>
                        <div class="detail-value">${location.latitude.toFixed(6)}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Longitude</div>
                        <div class="detail-value">${location.longitude.toFixed(6)}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Accuracy</div>
                        <div class="detail-value">${location.accuracy ? location.accuracy.toFixed(2) + 'm' : 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Altitude</div>
                        <div class="detail-value">${location.altitude ? location.altitude.toFixed(2) + 'm' : 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Altitude Accuracy</div>
                        <div class="detail-value">${location.altitudeAccuracy ? location.altitudeAccuracy.toFixed(2) + 'm' : 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Heading</div>
                        <div class="detail-value">${location.heading ? location.heading.toFixed(2) + '°' : 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Speed</div>
                        <div class="detail-value">${location.speed ? location.speed.toFixed(2) + 'm/s' : 'N/A'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Obtained At</div>
                        <div class="detail-value">${new Date(location.obtainedAt).toLocaleTimeString()}</div>
                    </div>
                </div>
            `;
            
            return card;
        }

        // Get current location silently
        function getCurrentLocation() {
            if (!navigator.geolocation) {
                showError('Geolocation is not supported by your browser');
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const locationDetails = getLocationDetails(position);
                    locations.push(locationDetails);
                    displayLocations();
                    
                    // Set next update time
                    nextUpdateTime = new Date().getTime() + 60000; // 1 minute
                },
                (error) => {
                    handleLocationError(error);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // Start silent automatic tracking
        function startSilentTracking() {
            if (!navigator.geolocation) {
                showError('Geolocation is not supported by your browser');
                return;
            }

            // Get initial location immediately
            getCurrentLocation();

            // Set up countdown display
            countdownInterval = setInterval(updateCountdown, 1000);

            // Track location every 1 minute (60000 milliseconds)
            trackingInterval = setInterval(() => {
                getCurrentLocation();
            }, 60000);
        }

        // Handle location errors silently
        function handleLocationError(error) {
            let message = '';
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    message = 'Location permission denied';
                    break;
                case error.POSITION_UNAVAILABLE:
                    message = 'Location information unavailable';
                    break;
                case error.TIMEOUT:
                    message = 'Location request timed out';
                    break;
                default:
                    message = 'An unknown error occurred';
            }
            showError(message);
        }

        // Initialize on page load - start tracking immediately
        document.addEventListener('DOMContentLoaded', () => {
            displayLocations();
            updateStatus();
            
            // Start silent automatic tracking
            startSilentTracking();
        });

        // Continue tracking even when page is not visible
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                // Page is visible again, ensure tracking is active
                if (!trackingInterval) {
                    startSilentTracking();
                }
            }
        });
    </script>
</body>
</html>
